$kind: http-request
name: 2. POST /api/v1/auth/login - Login with same credentials
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{candidateEmail}}",
      "password": "{{candidatePassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login successful and token received', function () {
          pm.expect(pm.response.code).to.equal(200);
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.token).to.exist;
          pm.collectionVariables.set('authToken', json.data.token);
          console.log('Token saved:', json.data.token);
      });
    language: text/javascript
order: 2000
