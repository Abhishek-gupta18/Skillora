$kind: http-request
name: 1. POST /api/v1/auth/register - Register new candidate
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{candidateEmail}}",
      "password": "{{candidatePassword}}",
      "name": "Test Candidate",
      "phone": "+919876543210",
      "dob": "2000-01-15",
      "gender": "male"
    }
order: 1000
